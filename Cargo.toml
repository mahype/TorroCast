[workspace]
members = [
    "crates/torrocast-net",
    "crates/torrocast-directory",
    "crates/torrocast-feed",
    "crates/torrocast-player",
    "crates/torrocast-core",
    "crates/torrocast-tui",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TorroCast contributors"]
repository = "https://github.com/mahype/TorroCast"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
