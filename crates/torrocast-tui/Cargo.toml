[package]
name = "torrocast-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Terminal interface for TorroCast."

[lints]
workspace = true

[dependencies]
torrocast-core = { path = "../torrocast-core" }
chrono.workspace = true
ratatui = "0.30"
unicode-width = "0.2"
torrocast-net = { path = "../torrocast-net" }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
# The player without a window saves its place when the system tells it to end.
ctrlc = { version = "3", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
torrocast-feed = { path = "../torrocast-feed" }

[features]
# Opus playback; see torrocast-player.
opus = ["torrocast-core/opus"]
opus-bundled = ["torrocast-core/opus-bundled"]

[[bin]]
name = "torrocast"
path = "src/main.rs"
