[package]
name = "torrocast-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Terminal interface for TorroCast."

[lints]
workspace = true

[dependencies]
torrocast-core = { path = "../torrocast-core" }
chrono.workspace = true
ratatui = "0.30"
unicode-width = "0.2"
torrocast-net = { path = "../torrocast-net" }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
torrocast-feed = { path = "../torrocast-feed" }

[[bin]]
name = "torrocast"
path = "src/main.rs"
